name: Verify bookmark workspace
on:
  push:
    branches: [main, 'chloe/**']
  pull_request:
  workflow_dispatch:
    inputs:
      live_minimax:
        description: Run five synthetic MiniMax CN acceptance calls (uses repository secret)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install isolated native-window test support
        run: sudo apt-get update && sudo apt-get install -y openbox xdotool dbus-x11
      - name: Verify browser workflows and native action popup
        timeout-minutes: 10
        run: xvfb-run -a dbus-run-session -- bash -c 'openbox > /tmp/bookmark-openbox.log 2>&1 & npm run test:browser'
        env:
          E2E_HEADED: '1'
          E2E_NATIVE_POPUP: shortcut
          PW_CHROMIUM_ATTACH_TO_OTHER: '1'
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/bookmark-e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: ${{ runner.temp }}/bookmark-e2e-artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bookmark-workspace-chrome
          path: .output/chrome-mv3/
          include-hidden-files: true
          if-no-files-found: error

  minimax-live:
    needs: verify
    # Explicit one-shot opt-in only; never runs on PRs or ordinary future pushes.
    if: >-
      github.repository == 'AngusFan-GH/ai-bookmark-manager' &&
      github.ref == 'refs/heads/chloe/bookmark-workspace' &&
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_dispatch' && inputs.live_minimax == true) ||
       (github.event_name == 'push' && github.event.head_commit.message == 'test: run bounded MiniMax acceptance [live-20261017-v1]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile the live harness without credentials
        run: node tests/live/run-minimax.mjs --build
      - name: Five bounded synthetic calls through the actual MiniMax provider and domain parser
        run: node tests/live/run-minimax.mjs
        timeout-minutes: 8
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LIVE_REQUESTED: ${{ inputs.live_minimax }}
          LIVE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
