name: Verify bookmark workspace
on:
  push:
    branches: [main, 'chloe/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/bookmark-e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: ${{ runner.temp }}/bookmark-e2e-artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bookmark-workspace-chrome
          path: .output/chrome-mv3/
          include-hidden-files: true
          if-no-files-found: error
